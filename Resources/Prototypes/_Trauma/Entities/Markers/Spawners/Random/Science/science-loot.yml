# Common science equipment, usually available at round start.
- type: entityTable
  id: ScienceEquipmentCommon
  table: !type:GroupSelector
    children:
    - id: AnomalyScanner
    - id: NodeScanner
    - id: Igniter
    - id: ClothingHandsGlovesLatex
    - id: ClothingMaskSterile
    - id: ClothingOuterCoatRnd
