# Rare science equipment, T1 and T2 technologies.
- type: entityTable
  id: ScienceEquipmentValuable
  table: !type:GroupSelector
    children:
    - id: AnomalyScanner
    - id: NodeScanner
    - id: Igniter
    - id: ClothingHandsGlovesLatex
    - id: ClothingMaskSterile
    - id: ClothingOuterCoatRnd
    - id: RemoteSignaller
