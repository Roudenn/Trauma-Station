- type: entity
  id: DimSmallLight
  suffix: Dim, Always Powered
  parent: SmallLight
  components:
  - type: Sprite
    state: base
  - type: PointLight
    enabled: true
    radius: 5
    energy: 0.5
    softness: 3
    color: "#ba473f"
  - type: PoweredLight
    hasLampOnSpawn: DimLightBulb
  - type: DamageOnInteract
    damage:
      types:
        Heat: 1
    popupText: powered-light-component-burn-hand

- type: entity
  id: WarmSmallLight
  suffix: Warm, Always Powered
  parent: SmallLight
  components:
  - type: Sprite
    state: base
  - type: PointLight
    enabled: true
    radius: 6
    energy: 1
    softness: 3
    color: "#FF8A0C"
  - type: PoweredLight
    hasLampOnSpawn: WarmLightBulb
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand

# Humming lights

- type: entity
  id: HummingSmallLight
  suffix: Humming, Always Powered
  parent: SmallLight
  components:
  - type: AmbientSound
    enabled: true
    volume: -12
    range: 5
    sound:
      path: /Audio/_Trauma/Effects/hum.ogg

- type: entity
  id: DimHummingSmallLight
  suffix: Dim, Humming, Always Powered
  parent: DimSmallLight
  components:
  - type: AmbientSound
    enabled: true
    volume: -12
    range: 5
    sound:
      path: /Audio/_Trauma/Effects/hum.ogg

- type: entity
  id: WarmHummingSmallLight
  suffix: Warm, Humming, Always Powered
  parent: WarmSmallLight
  components:
  - type: AmbientSound
    enabled: true
    volume: -12
    range: 5
    sound:
      path: /Audio/_Trauma/Effects/hum.ogg
