- type: dungeonConfig
  id: RandomRoomTest
  layers:
  - !type:RandomRoomDunGen
    roomCount: 15
    roomSize: !type:RoomSizeSelector
      width: 3,9
      height: 3,9
    areaSize: 50,50
    tile: Plating

  - !type:CorridorDunGen
    width: 3
    tile: FloorSteel

  - !type:BoundaryWallDunGen
    wall: WallSolid
    cornerWall: WallReinforced
    tile: Plating

- type: dungeonConfig
  id: ShapeRoomTestBig
  layers:
  - !type:ShapeRoomDunGen
    areaSize: 150,150
    tile: Plating
    minRoomWidth: 5
    minRoomHeight: 5
    cutProb: 0.1 # Prefer more tunnels to large rooms

  # Room roles
  - !type:RoomRoleDunGen
    minSize: 3,3
    maxSize: 6,6
    prob: 0.5
    weightsId: RoomMaintenanceSmall

  - !type:RoomRoleDunGen
    minSize: 6,6
    prob: 0.5
    weightsId: RoomMaintenanceMedium

  - !type:RoomRoleDunGen
    weightsId: RoomMaintenanceDefault # Fallback for all unassigned rooms

  - !type:WallMountDunGen
    contents: MaintenanceWalls
    tile: Plating

  # Walls and airlocks
  - !type:RoomEntranceDunGen
    tile: FloorSteel
    contents: MaintenanceAirlock

  - !type:BoundaryWallDunGen
    wall: WallSolid
    cornerWall: WallReinforced
    tile: Plating

  # Features
  - !type:FeatureDunGen
    feature:
      id: MaintenanceLight
      obstruct: false
    position: !type:RoomRandomPosition

  - !type:FeatureDunGen
    feature:
      id: MaintenanceClosetLootRow
    position: !type:RoomSidePosition
      availableSides:
      - Top
      - Bottom
      - Left
      - Right
    requireAll: false
    conditions:
    - !type:RoomRoleCondition
      role: RoomMaintenance
    - !type:RoomRoleCondition
      role: RoomMaintenanceGenerator

  - !type:FeatureDunGen
    feature:
      id: MaintenanceApc
    position: !type:RoomSidePosition
      availableSides:
      - Top
      - Bottom
      - Left
      - Right

  - !type:FeatureDunGen
    feature:
      id: MaintenanceGenerator
    position: !type:RoomSidePosition
      availableSides:
      - Center
    conditions:
    - !type:RoomRoleCondition
      role: RoomMaintenanceGenerator

  - !type:FeatureDunGen
    feature:
      id: OfficeDecoration
    position: !type:RoomSidePosition
      availableSides:
      - Top
      - Bottom
      - Left
      - Right
      - TopLeft
      - TopRight
      - BottomLeft
      - BottomRight
    conditions:
    - !type:RoomRoleCondition
      role: RoomMaintenanceLibrary

  - !type:FeatureDunGen
    feature:
      id: BookshelvesLine
    position: !type:RoomRandomPosition
    conditions:
    - !type:RoomRoleCondition
      role: RoomMaintenanceLibrary

  - !type:FeatureDunGen
    feature:
      id: ReadingTable
    position: !type:RoomRandomPosition
    conditions:
    - !type:RoomRoleCondition
      role: RoomMaintenanceLibrary

  - !type:EntityTableDunGen
    minCount: 125
    maxCount: 180
    perDungeon: true
    ignoreReserved: true
    table:
      id: Girder

  - !type:EntityTableDunGen
    minCount: 100
    maxCount: 150
    perDungeon: true
    ignoreReserved: true
    table:
      id: ReinforcedGirder

  - !type:EntityTableDunGen
    minCount: 80
    maxCount: 120
    perDungeon: true
    ignoreReserved: true
    table:
      id: ReinforcedWindow

  - !type:EntityTableDunGen
    minCount: 150
    maxCount: 250
    perDungeon: true
    ignoreReserved: true
    table:
      id: Window

  # Loot

  - !type:EntityTableDunGen
    minCount: 750
    maxCount: 1500
    perDungeon: true
    ignoreReserved: true
    table: !type:NestedSelector
      tableId: GenericTrashItems

  - !type:EntityTableDunGen
    minCount: 500
    maxCount: 1000
    perDungeon: true
    ignoreReserved: true
    table: !type:NestedSelector
      tableId: SalvageScrapSpawnerCommon

  - !type:EntityTableDunGen
    minCount: 200
    maxCount: 300
    perDungeon: true
    ignoreReserved: true
    table: !type:NestedSelector
      tableId: SalvageScrapSpawnerValuable

  - !type:EntityTableDunGen
    minCount: 250
    maxCount: 400
    perDungeon: true
    ignoreReserved: true
    table: !type:NestedSelector
      tableId: SalvageTreasureSpawnerCommon

  - !type:EntityTableDunGen
    minCount: 100
    maxCount: 200
    perDungeon: true
    ignoreReserved: true
    table: !type:NestedSelector
      tableId: SalvageTreasureSpawnerValuable

  # Tiles
  - !type:FeatureFillDunGen
    feature:
      id: MaintenanceFloor
    requireAll: false
    conditions:
    - !type:RoomRoleCondition
      role: RoomMaintenance
    - !type:RoomRoleCondition
      role: RoomMaintenanceGenerator

  - !type:FeatureFillDunGen
    feature:
      id: MaintenanceLibraryFloor
    requireAll: false
    conditions:
    - !type:RoomRoleCondition
      role: RoomMaintenanceLibrary

  # Other

  - !type:AutoCablingDunGen
    entity: CableApcExtension

  - !type:AutoCablingDunGen
    entity: CableMV
    nodeGroup: MVPower

  - !type:AutoCablingDunGen
    entity: CableHV
    nodeGroup: HVPower

  - !type:FeatureFillDunGen
    feature:
      id: MaintenanceCatwalk


