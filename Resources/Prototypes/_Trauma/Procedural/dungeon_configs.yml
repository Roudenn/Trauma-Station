- type: dungeonConfig
  id: RandomRoomTest
  layers:
  - !type:RandomRoomDunGen
    roomCount: 15
    roomSize: !type:RoomSizeSelector
      width: 3,9
      height: 3,9
    areaSize: 50,50
    tile: Plating

  - !type:CorridorDunGen
    width: 3
    tile: FloorSteel

  - !type:BoundaryWallDunGen
    wall: WallSolid
    cornerWall: WallReinforced
    tile: Plating

- type: dungeonConfig
  id: ShapeRoomTestBig
  layers:
  - !type:ShapeRoomDunGen
    areaSize: 200,200
    tile: Plating
    minRoomWidth: 5
    minRoomHeight: 5

  - !type:RoomEntranceDunGen
    tile: FloorSteel
    contents: BaseAirlock

  - !type:BoundaryWallDunGen
    wall: WallSolid
    cornerWall: WallReinforced
    tile: Plating

  - !type:FeatureDunGen
    feature:
      id: MaintenanceClosetLootRow
    position: !type:RoomSidePosition
      availableSides:
      - Top
      - Bottom
      - Left
      - Right

- type: dungeonConfig
  id: ShapeRoomTestSmall
  layers:
  - !type:ShapeRoomDunGen
    areaSize: 15,15
    tile: Plating
    minRoomWidth: 5
    minRoomHeight: 5

  - !type:RoomEntranceDunGen
    tile: FloorSteel
    contents: BaseAirlock

  - !type:BoundaryWallDunGen
    wall: WallSolid
    cornerWall: WallReinforced
    tile: Plating

  - !type:FeatureDunGen
    feature:
      id: MaintenanceClosetLootRow
    position: !type:RoomSidePosition
      availableSides:
      - Top
      - Bottom
      - Left
      - Right
