- type: dungeonConfig
  id: RandomRoomTest
  layers:
  - !type:RandomRoomDunGen
    roomCount: 15
    roomSize: !type:RoomSizeSelector
      width: 3,9
      height: 3,9
    areaSize: 50,50
    tile: Plating

  - !type:CorridorDunGen
    width: 3
    tile: FloorSteel

  - !type:BoundaryWallDunGen
    wall: WallSolid
    cornerWall: WallReinforced
    tile: Plating

- type: dungeonConfig
  id: ShapeRoomTest
  layers:
  - !type:ShapeRoomDunGen
    areaSize: 200,200
    tile: Plating
    minRoomWidth: 5
    minRoomHeight: 5

  - !type:BoundaryWallDunGen
    wall: WallSolid
    cornerWall: WallReinforced
    tile: Plating
