- type: feature
  id: MaintenanceClosetLootRow
  feature: !type:LineFeature
    conditionInheritance: true
    conditionsApplySelf: false
    conditions:
    - !type:UnobstructedFeatureCondition
      type:
      - Entity
    feature: !type:GroupFeature
      children:
      # Loot
      - ent: RandomMaintsCloset
        weight: 2
      - id: MaintenanceToolRack
        weight: 1
      - id: MaintenanceToolTable
        weight: 1
      # Canisters
      - ent: NitrogenCanister
        weight: 0.5
      - ent: OxygenCanister
        weight: 0.5
      - ent: AirCanister
        weight: 0.5
      - ent: CarbonDioxideCanister
        weight: 0.1
      - ent: NitrousOxideCanister
        weight: 0.05
      - ent: AmmoniaCanister
        weight: 0.05
      - ent: PlasmaCanister
        weight: 0.01
      - ent: TritiumCanister
        weight: 0.005
      - ent: FrezonCanister
        weight: 0.005
      # Tanks
      - ent: WeldingFuelTankFull
        weight: 1
      - ent: WaterTankFull
        weight: 1
      # Decorations
      - ent: PottedPlantRandom
        weight: 1
      - ent: Chair # TODO this somehow needs random/conditional rotation
        weight: 0.75

- type: feature
  id: MaintenanceToolRack
  feature: !type:AllFeature
    children:
    - ent: Rack
    - ent: MaintenanceToolSpawner
    - ent: MaintenanceWeaponSpawner
    - ent: MaintenanceFluffSpawner

- type: feature
  id: MaintenanceToolTable
  feature: !type:AllFeature
    children:
    - ent: Table
    - ent: MaintenanceToolSpawner
    - ent: MaintenanceWeaponSpawner
    - ent: MaintenanceFluffSpawner

- type: feature
  id: MaintenanceFloor
  feature: !type:AllFeature
    children:
    - !type:GroupFeature
      children:
      - tile: Plating
        weight: 2
      - tile: FloorSteel
        weight: 1
      - tile: FloorTechMaint
        weight: 1
      - tile: FloorTechMaintDark
        weight: 1

# Generator rooms

- type: feature
  id: MaintenanceApc
  feature: !type:AllFeature
    children:
    - !type:WallMountFeature
      feature: !type:AllFeature
        children:
        - ent: APCBasic
        - ent: CableMV
        - ent: CableApcExtension

- type: feature
  id: MaintenanceGenerator
  feature: !type:AllFeature
    children:
    - !type:AllFeature
      conditions:
      - !type:UnobstructedFeatureCondition
      children:
      - ent: GeneratorRTG
      - ent: CableHV
    - !type:WallMountFeature
      feature: !type:AllFeature
        children:
        - ent: SubstationWallBasic
        - ent: CableMV
        - ent: CableHV

# Spawns a catwalk on plating tiles with exposed cables in order to hide them
- type: feature
  id: MaintenanceCatwalk
  feature: !type:EntFeature
    ent: Catwalk
    conditions:
    - !type:TileFeatureCondition
      tiles:
      - Plating
    - !type:EntityFeatureCondition
      whitelist:
        components:
        - NodeContainer
