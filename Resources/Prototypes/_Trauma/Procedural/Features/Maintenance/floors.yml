# Default maintenance tiling
- type: feature
  id: MaintenanceFloor
  feature: !type:AllFeature
    children:
    - !type:GroupFeature
      children:
      - tile: Plating
        weight: 2
      - tile: FloorSteel
        weight: 1
      - tile: FloorTechMaint
        weight: 1
      - tile: FloorTechMaintDark
        weight: 1
    - ent: Catwalk # TODO remove this when Maintrooms have cables
      prob: 0.07
    - !type:GroupFeature
      prob: 0.3
      children:
      - ent: DecalSpawnerBloodSplattersTrauma
      - ent: DecalSpawnerGraffiti
      - ent: DecalSpawnerDirtWide
      - ent: DecalSpawnerDirtMonospace
      - ent: DecalSpawnerBurns

# Spawns a catwalk on plating tiles with exposed cables in order to hide them
# Currently unused since Maintrooms don't have cables yet
- type: feature
  id: MaintenanceCatwalk
  feature: !type:EntFeature
    ent: Catwalk
    conditions:
    - !type:TileFeatureCondition
      tiles:
      - Plating
    - !type:EntityFeatureCondition
      whitelist:
        components:
        - NodeContainer

