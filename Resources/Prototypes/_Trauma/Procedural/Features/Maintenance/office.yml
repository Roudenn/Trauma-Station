- type: feature
  id: BookshelvesLine
  feature: !type:LineFeature
    maxSpawns: 6
    feature:
      ent: BookshelfFilled
      prob: 0.8 # Statistically will have at least 1 opening
      conditions:
      - !type:UnobstructedFeatureCondition

- type: feature
  id: ReadingTable
  feature: !type:AllFeature
    conditionInheritance: true
    conditionsApplySelf: false
    conditions:
    - !type:UnobstructedFeatureCondition
    children:
    - ent: TableWood
    - ent: TableWood
      offset: -1,0
    - ent: TableWood
      offset: 1,0
    - !type:GroupFeature
      children:
      - ent: ChairWood
        offset: 0,1
      - ent: ChairWood
        offset: 0,-1
    - ent: Paper
      offset: !type:RangeFeaturePosition
        minPos: -0.3,-0.3
        maxPos: 0.3,0.3
    - ent: Pen
      offset: !type:RangeFeaturePosition
        minPos: -0.3,-0.3
        maxPos: 0.3,0.3
    - ent: BookRandomStory
      offset: !type:RangeFeaturePosition
        minPos: -1.3,-0.3
        maxPos: -0.3,0.3

- type: feature
  id: OfficeDecoration
  feature: !type:GroupFeature
    children:
    - ent: PottedPlantRandom
      weight: 2
    - ent: WaterCooler
      weight: 1
    - ent: LockerFreezerBase
      weight: 0.3
    - !type:AllFeature
      weight: 1
      children:
      - ent: TableWood
      - ent: PaperBin5

- type: feature
  id: TableLine
  feature: !type:LineFeature
    maxSpawns: 8
    feature: !type:AllFeature
      children:
      - ent: Table
      - !type:GroupFeature
        children:
        - ent: Pen
          weight: 3
        - ent: Paper
          weight: 3
        - ent: PaperOffice
          weight: 3
        - ent: PaperBin5
        - ent: BookRandomStory
        - ent: PaperCaptainsThoughts
          weight: 0.05
        - ent: CyberPen
          weight: 0.05
      conditions:
      - !type:UnobstructedFeatureCondition

- type: feature
  id: ComputerLine
  feature: !type:LineFeature
    maxSpawns: 4
    feature: !type:GroupFeature
      children:
      - ent: ComputerBroken
      - ent: ComputerFrame
      - ent: BaseComputer
      conditions:
      - !type:UnobstructedFeatureCondition
