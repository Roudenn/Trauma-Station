- type: proceduralConfig
  id: Maintrooms
  chunkGenerator:
    !type:BSPChunkGenerator
    areaSize: 150,150
    minRoomWidth: 5
    minRoomHeight: 5
    cutProb: 0.1
  regionGenerator: !type:SingleRegionGenerator # TODO PROCEDURAL add support for infinite regions
  regionEffects: MaintroomsRegionEffects
  chunkEffects: MaintroomsChunkEffects

- type: entityEffect
  id: MaintroomsRegionEffects
  effects:
  - !type:RegionAssignRoles
    selector: !type:GroupChunkRoleSelector
      children:
      - role: RoomMaintenance
        weight: 0.9
      - !type:SizeChunkRoleSelector
        weight: 0.1
        sizeDict:
          3,3: !type:GroupChunkRoleSelector
            children:
            - role: RoomMaintenanceArcade
            - role: RoomMaintenanceAtmos
            - role: RoomMaintenanceBotany
            - role: RoomMaintenanceDorm
            - role: RoomMaintenanceEngineering
            - role: RoomMaintenanceKitchen
            - role: RoomMaintenanceMedical
            - role: RoomMaintenancePrison
            - role: RoomMaintenanceSecurity
            - role: RoomMaintenanceGenerator
            - role: RoomMaintenanceOutpost
              weight: 0.2
          5,5: !type:GroupChunkRoleSelector
            children:
            - role: RoomMaintenanceLibrary
              weight: 2
            - role: RoomMaintenanceOffice
              weight: 2
            - role: RoomMaintenanceScience
            - role: RoomMaintenanceBar
            - role: RoomMaintenanceFirelockAnomaly
              weight: 0.1
  - !type:RegionTileFill
    tile: Plating

- type: entityEffect
  id: MaintroomsChunkEffects
  effects:
  - !type:ChunkBoundaryWalls
    table:
      id: WallSolid
  - !type:NestedEffect
    proto: MaintroomsMaintenance # Default maintenance halls
  - !type:NestedEffect
    proto: MaintroomsAnomalies # Extremely rare room anomalies with weird stuff
  - !type:NestedEffect
    proto: MaintroomsEngineering # Engineering storage rooms
  - !type:NestedEffect
    proto: MaintroomsMedical # Surgery, chemistry, and storage rooms
  - !type:NestedEffect
    proto: MaintroomsScience # Artifact rooms and anomaly research rooms
  - !type:NestedEffect
    proto: MaintroomsSecurity # Prison cells & control points
  - !type:NestedEffect
    proto: MaintroomsCargo # Cargo storage rooms
  - !type:NestedEffect
    proto: MaintroomsService # Bars, kitchens, botanies
  - !type:NestedEffect
    proto: MaintroomsCivillian # Public places like libraries, dorms, etc.
  # Additional loot added to some rooms
  - !type:NestedEffect
    proto: MaintroomsSalvageLoot # Scrap and rare materials usually found on salvage wrecks
  - !type:NestedEffect
    proto: MaintroomsTrash # Random trash that appears literally everywhere
  - !type:NestedEffect
    proto: MaintroomsStructures # Random obstacles in the middle of maintenance rooms
  # Tiles & decals for every role type (added at the very end to not mess up generation algorithms)
  - !type:NestedEffect
    proto: MaintroomsFloor
