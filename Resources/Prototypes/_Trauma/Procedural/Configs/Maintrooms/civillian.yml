- type: entityEffect
  id: MaintroomsCivillian
  effects:
  - !type:NestedEffect
    proto: MaintroomsLibrary
  - !type:NestedEffect
    proto: MaintroomsDorms
  - !type:NestedEffect
    proto: MaintroomsOffice
  - !type:ChunkFeature
    feature:
      id: OfficeDecoration
      rolls: 1, 4
      offset: !type:ChunkSideFeaturePosition
        availableSides:
        - Top
        - Bottom
        - Left
        - Right
        - TopLeft
        - TopRight
        - BottomLeft
        - BottomRight

- type: entityEffect
  id: MaintroomsLibrary
  effects:
  - !type:ChunkFeature
    feature:
      id: BookshelvesLine
      rolls: 1, 2
      offset: !type:ChunkRandomFeaturePosition
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceLibrary
  - !type:ChunkFeature
    feature:
      id: ReadingTable
      offset: !type:ChunkRandomFeaturePosition
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceLibrary

# Dorms for living
- type: entityEffect
  id: MaintroomsDorms
  effects:
  - !type:ChunkFeature
    feature:
      id: MaintenanceDormClosets
      offset: !type:ChunkSideFeaturePosition
        availableSides:
        - TopRight
        - BottomRight
        - Right
    requireAll: false
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceDorm
    - !type:ChunkRoleCondition
      role: RoomMaintenanceOffice
  - !type:ChunkFeature
    feature:
      id: MaintenanceDormBed
      offset: !type:ChunkSideFeaturePosition
        availableSides:
        - Center
        - TopLeft
        - Left
        - BottomLeft
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceDorm
  - !type:ChunkFeature
    feature:
      id: MaintenanceDormLight
      offset: !type:ChunkSideFeaturePosition
        availableSides:
        - Center
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceDorm

# Office rooms with consoles, papers, faxes and stuff
- type: entityEffect
  id: MaintroomsOffice
  effects:
  - !type:ChunkFeature
    feature:
      id: TableLine
      offset: !type:ChunkSideFeaturePosition
        availableSides:
        - Top
        - Bottom
        - Left
        - Right
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceOffice
  - !type:ChunkFeature
    feature:
      id: ComputerLine
      offset: !type:ChunkRandomFeaturePosition
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceOffice
