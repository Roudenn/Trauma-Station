- type: entityEffect
  id: MaintroomsAnomalies
  effects:
  - !type:NestedEffect
    proto: MaintroomsFirelockAnomaly

- type: entityEffect
  id: MaintroomsFirelockAnomaly # A lot of firelocks with a plasma chamber in the center.
  effects:
  - !type:ChunkFeature
    feature:
      id: MaintenanceAnomalyFireChamber
      offset: !type:ChunkSideFeaturePosition
        availableSides:
        - Center
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceFirelockAnomaly
  - !type:ChunkFeatureFill
    feature:
      ent: FirelockGlass
      conditions:
      - !type:UnobstructedFeatureCondition
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceFirelockAnomaly
