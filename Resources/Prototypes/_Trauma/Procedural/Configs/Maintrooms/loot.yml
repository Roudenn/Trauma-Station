- type: entityEffect
  id: MaintroomsSalvageLoot
  effects:
  - !type:ChunkFeature
    feature:
      table: SalvageScrapSpawnerCommon
      offset:
        combine:
        - -0.5,-0.5,0.5,0.5
        - !type:ChunkRandomFeaturePosition
      rolls: !type:ChunkScaleValueSelector
        scale: 0.1
        selector: !type:BinomialNumberSelector
          trials: 10
          chance: 0.33
  - !type:ChunkFeature
    feature:
      table: SalvageScrapSpawnerValuable
      rolls: !type:ChunkScaleValueSelector
        scale: 0.06
        selector: !type:BinomialNumberSelector
          trials: 8
          chance: 0.33
      offset:
        combine:
        - -0.5,-0.5,0.5,0.5
        - !type:ChunkRandomFeaturePosition

