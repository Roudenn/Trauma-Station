- type: entityEffect
  id: MaintroomsMaintenance
  effects:
  # Lights are shared for all rooms
  - !type:ChunkFeature
    feature:
      id: MaintenanceLight
      obstruct: false
      prob: 0.8
      offset: !type:ChunkRandomFeaturePosition
  - !type:ChunkFeature
    feature:
      id: MaintenanceClosetLootRow
      rolls: 1, 2
      offset: !type:ChunkSideFeaturePosition
        availableSides:
        - Top
        - Bottom
        - Left
        - Right
    requireAll: false
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenance
    - !type:ChunkRoleCondition
      role: RoomMaintenanceGenerator
  - !type:ChunkFeature
    feature:
      id: MaintenanceGenerator
      offset: !type:ChunkSideFeaturePosition
        availableSides:
        - Center
    conditions:
    - !type:ChunkRoleCondition
      role: RoomMaintenanceGenerator
